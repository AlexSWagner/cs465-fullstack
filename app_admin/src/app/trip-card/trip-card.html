<div style="border: 3px solid #ddd; border-radius: 10px; overflow: hidden; height: 100%; box-shadow: 0 6px 15px rgba(0,0,0,0.15); background: white;">
  <!-- Image container with fixed height -->
  <div style="position: relative; height: 220px; overflow: hidden;">
    <img src="assets/images/{{ trip.image }}" alt="Trip to {{ trip.name }}" 
         style="width: 100%; height: 100%; object-fit: cover;">
    <!-- Edit button in top right corner -->
    <div style="position: absolute; top: 10px; right: 10px;" *ngIf="isLoggedIn()">
      <button (click)="editTrip(trip)" class="btn" 
              style="background-color: #2a8a7d; color: white; font-size: 16px; padding: 8px 16px; border: none;">
        <i class="bi bi-pencil-square me-1"></i>Edit Trip
      </button>
    </div>
  </div>

  <!-- Card content with consistent padding -->
  <div style="padding: 20px;">
    <!-- Large destination name -->
    <h2 style="font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 15px;">
      {{ trip.name }}
    </h2>
    
    <!-- Medium-sized resort name -->
    <h4 style="font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px;">
      {{ trip.resort }}
    </h4>
    
    <!-- Price info -->
    <p style="font-size: 16px; text-align: center; margin-bottom: 15px;">
      {{trip.length}} · {{trip.perPerson | currency: 'USD': 'symbol'}} per person
    </p>
    
    <!-- Description text -->
    <p style="font-size: 16px;" [innerHTML]="trip.description"></p>
  </div>
</div>
