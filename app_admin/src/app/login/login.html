<div class="row">
  <div class="col-12 col-md-6 offset-md-3">
    <h2>Login to your Account</h2>
    <p *ngIf="formError" class="alert alert-danger" role="alert">
      {{ formError }}
    </p>
    <form (ngSubmit)="onLoginSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email address" [(ngModel)]="credentials.email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" [(ngModel)]="credentials.password">
      </div>
      <button type="submit" role="button" class="btn btn-primary">Sign In!</button>
    </form>
  </div>
</div>
