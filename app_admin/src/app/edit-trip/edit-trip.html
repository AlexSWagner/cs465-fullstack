<div class="col-md-8 mx-auto" style="max-width: 700px;">
  <h2 class="text-center" style="font-size: 36px; margin-bottom: 30px;">Edit Trip</h2>
  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()" class="d-flex flex-column align-items-center">
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="code" placeholder="Code" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">
      <div *ngIf="submitted && f['code'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['code'].errors?.['required']">Trip Code is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="name" placeholder="Name" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['name'].errors?.['required']">Name is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="length" placeholder="Length" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
      <div *ngIf="submitted && f['length'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['length'].errors?.['required']">Length is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="date" formControlName="start" placeholder="Start Date" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%;" [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
      <div *ngIf="submitted && f['start'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['start'].errors?.['required']">Date is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="resort" placeholder="Resort" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
      <div *ngIf="submitted && f['resort'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['resort'].errors?.['required']">Resort is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="perPerson" placeholder="Price Per Person" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
      <div *ngIf="submitted && f['perPerson'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['perPerson'].errors?.['required']">Per Person is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <input type="text" formControlName="image" placeholder="Image Name" class="form-control" style="font-size: 20px; padding: 15px; height: auto; width: 100%; word-wrap: break-word;" [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
      <div *ngIf="submitted && f['image'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['image'].errors?.['required']">Image Name is required</div>
      </div>
    </div>
    <div class="form-group mb-4" style="width: 50%;">
      <textarea formControlName="description" placeholder="Description" class="form-control" style="font-size: 20px; padding: 15px; height: 150px; width: 100%; word-wrap: break-word; white-space: normal;" [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
      <div *ngIf="submitted && f['description'].errors" style="font-size: 18px; color: red; margin-top: 8px;">
        <div *ngIf="f['description'].errors?.['required']">Description is required</div>
      </div>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-info mt-4" style="font-size: 22px; padding: 12px 30px; background-color: #2a8a7d; border: none;">Save</button>
    </div>
  </form>
</div>
