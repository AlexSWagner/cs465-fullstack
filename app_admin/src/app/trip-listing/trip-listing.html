<div style="margin-bottom: 30px;">
  <button (click)="addTrip()" class="btn" style="background-color: #2a8a7d; color: white; font-size: 18px; padding: 12px 24px; border: none;">
    <i class="bi bi-plus-circle me-2"></i>Add Trip
  </button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px;">
  <div *ngFor="let trip of trips">
    <app-trip-card [trip]="trip"></app-trip-card>
  </div>
</div>

<!-- Responsive breakpoint for mobile -->
<style>
  @media (max-width: 992px) {
    div[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
  }
</style>
